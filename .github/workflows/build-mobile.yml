# Builds the Android APK and the iPhone app on GitHub's servers.
# iOS needs macOS + Xcode, which is why it runs here instead of on Windows.
# Run it from GitHub: Actions tab -> "Build mobile apps" -> Run workflow.
name: Build mobile apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: crossfit1000hills-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      # Unsigned build: proves the iOS app compiles and produces an .ipa that must be
      # signed (Apple Developer account) before it can be installed or sent to TestFlight.
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr CrossFit1000Hills-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: crossfit1000hills-ios-unsigned-ipa
          path: CrossFit1000Hills-unsigned.ipa
