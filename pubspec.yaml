name: gymone_app
description: "CrossFit 1000 Hills mobile client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.68.0
  webview_flutter: ^4.4.4
  intl: ^0.20.3
  pedometer: ^4.2.0
  permission_handler: 12.0.1
  sqflite: ^2.4.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
# App icon on the phone's home screen, generated from the gym logo.
# Regenerate after changing the logo:
#   dart run tool/make_app_icon.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
